openapi: 3.0.0
info:
  title: Google Maps Reviews API
  description: |
    The Google Maps Reviews API retrieves user reviews and ratings for places on Google Maps.
    Use this API to fetch customer reviews, ratings, and feedback for businesses and locations.

    **Cross-linking**: The place_id and data_id values returned by the Google Maps Search API or 
    Google Maps Place API can be used with this API to fetch reviews. Pass them as the place_id 
    or data_id parameters.
  version: 1.0.0
servers:
  - url: https://www.searchapi.io/api/v1
paths:
  /search:
    get:
      summary: Google Maps Reviews Search
      security:
        - ApiKeyAuth: []
        - ApiKeyQuery: []
      parameters:
        - name: engine
          in: query
          required: true
          description: Set to google_maps_reviews
          schema:
            type: string
            enum: ["google_maps_reviews"]
        - name: place_id
          in: query
          required: false
          description: Optional. Provide either place_id or data_id. At least one must be provided
          schema:
            type: string
        - name: data_id
          in: query
          required: false
          description: Optional. Provide either place_id or data_id. At least one must be provided
          schema:
            type: string
        - name: hl
          in: query
          required: false
          description: Language for the search results
          schema:
            type: string
            enum: ["af", "ak", "sq", "am", "ar", "hy", "az", "eu", "be", "bem", "bn", "bh", "xx-bork", "bs", "br", "bg", "km", "ca", "chr", "ny", "zh-cn", "zh-tw", "co", "hr", "cs", "da", "nl", "xx-elmer", "en", "eo", "et", "ee", "fo", "tl", "fi", "fr", "fy", "gaa", "gl", "ka", "de", "el", "kl", "gn", "gu", "xx-hacker", "ht", "ha", "haw", "iw", "hi", "hu", "is", "ig", "id", "ia", "ga", "it", "ja", "jw", "kn", "kk", "rw", "rn", "xx-klingon", "kg", "ko", "kri", "ku", "ckb", "ky", "lo", "la", "lv", "ln", "lt", "loz", "lg", "ach", "mk", "mg", "my", "ms", "ml", "mt", "mv", "mi", "mr", "mfe", "mo", "mn", "sr-me", "ne", "pcm", "nso", "no", "nn", "oc", "or", "om", "ps", "fa", "xx-pirate", "pl", "pt", "pt-br", "pt-pt", "pa", "qu", "ro", "rm", "nyn", "ru", "gd", "sr", "sh", "st", "tn", "crs", "sn", "sd", "si", "sk", "sl", "so", "es", "es-419", "su", "sw", "sv", "tg", "ta", "tt", "te", "th", "ti", "to", "lua", "tum", "tr", "tk", "tw", "ug", "uk", "ur", "uz", "vu", "vi", "cy", "wo", "xh", "yi", "yo", "zu"]
            default: "en"
        - name: gl
          in: query
          required: false
          description: Country of the search
          schema:
            type: string
            enum: ["af", "al", "dz", "as", "ad", "ao", "ai", "aq", "ag", "ar", "am", "aw", "au", "at", "az", "bs", "bh", "bd", "bb", "by", "be", "bz", "bj", "bm", "bt", "bo", "ba", "bw", "bv", "br", "io", "bn", "bg", "bf", "bi", "kh", "cm", "ca", "cv", "ky", "cf", "td", "cl", "cn", "cx", "cc", "co", "km", "cg", "cd", "ck", "cr", "ci", "hr", "cu", "cy", "cz", "dk", "dj", "dm", "do", "ec", "eg", "sv", "gq", "er", "ee", "et", "fk", "fo", "fj", "fi", "fr", "gf", "pf", "tf", "ga", "gm", "ge", "de", "gh", "gi", "gr", "gl", "gd", "gp", "gu", "gt", "gn", "gw", "gy", "ht", "hm", "va", "hn", "hk", "hu", "is", "in", "id", "ir", "iq", "ie", "il", "it", "jm", "jp", "jo", "kz", "ke", "ki", "kp", "kr", "kw", "kg", "la", "lv", "lb", "ls", "lr", "ly", "li", "lt", "lu", "mo", "mk", "mg", "mw", "my", "mv", "ml", "mt", "mh", "mq", "mr", "mu", "yt", "mx", "fm", "md", "mc", "mn", "ms", "ma", "mz", "mm", "na", "nr", "np", "nl", "nc", "nz", "ni", "ne", "ng", "nu", "nf", "mp", "no", "om", "pk", "pw", "ps", "pa", "pg", "py", "pe", "ph", "pn", "pl", "pt", "pr", "qa", "re", "ro", "ru", "rw", "sh", "kn", "lc", "pm", "vc", "ws", "sm", "st", "sa", "sn", "rs", "sc", "sl", "sg", "sk", "si", "sb", "so", "za", "gs", "es", "lk", "sd", "sr", "sj", "sz", "se", "ch", "sy", "tw", "tj", "tz", "th", "tl", "tg", "tk", "to", "tt", "tn", "tr", "tm", "tc", "tv", "ug", "ua", "ae", "uk", "gb", "us", "um", "uy", "uz", "vu", "ve", "vn", "vg", "vi", "wf", "eh", "ye", "zm", "zw", "gg", "je", "im", "me"]
        - name: topic_id
          in: query
          required: false
          description: Filter reviews by topic. Topic ids are returned in the response under the topics key, for example EFmBwTPtiaA. KGMID values such as /m/06mbny for Hospitality are also accepted.
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          description: Sort reviews by specified criteria
          schema:
            type: string
            enum: ["most_relevant", "newest", "highest_rating", "lowest_rating"]
        - name: num
          in: query
          required: false
          description: Number of reviews to return per page
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
        - name: next_page_token
          in: query
          required: false
          description: Token for pagination to retrieve next page of results
          schema:
            type: string
      x-required-one-of:
        - ["place_id", "data_id"]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Validation Error. There is an issue with query parameters, such as missing required parameters or invalid values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication Error. The API key is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate Limit Exceeded. The number of allowed requests has been exceeded. Consider upgrading your plan or waiting for the limit to reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server Error. Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Timeout. We could not retrieve results in 90 seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Use Bearer authentication. Format: "Bearer YOUR_API_KEY"'
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key
      description: Pass API key as query parameter
  schemas:
    SearchResponse:
      type: object
      properties:
        search_metadata:
          $ref: '#/components/schemas/SearchMetadata'
        search_parameters:
          $ref: '#/components/schemas/SearchParameters'
        place_result:
          $ref: '#/components/schemas/PlaceResult'
        topics:
          type: array
          description: Review topics for the place. Returned on the first page when available.
          items:
            $ref: '#/components/schemas/Topic'
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        pagination:
          $ref: '#/components/schemas/Pagination'
        error:
          type: string
          description: Error message if the search failed
    SearchMetadata:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
          description: Unique identifier for the search request
        status:
          type: string
          description: Status of the search request
        created_at:
          type: string
          format: date-time
          description: Timestamp when the search was created
        request_time_taken:
          type: number
          description: Time taken to make the request in seconds
        parsing_time_taken:
          type: number
          description: Time taken to parse the results in seconds
        total_time_taken:
          type: number
          description: Total time taken for the search in seconds
        request_url:
          type: string
          description: Google Maps URL for this search
        html_url:
          type: string
          description: URL to view HTML results
        json_url:
          type: string
          description: URL to view JSON results
    SearchParameters:
      type: object
      properties:
        engine:
          type: string
          description: The engine used (google_maps_reviews)
        data_id:
          type: string
          description: The data ID used for the search
        place_id:
          type: string
          description: The place ID used for the search
        topic_id:
          type: string
          description: Topic id used to filter reviews by topic
        sort_by:
          type: string
          description: Sort order for reviews
        hl:
          type: string
          description: Language code for results
        gl:
          type: string
          description: Country of the search
        num:
          type: integer
          description: Number of results per page
        next_page_token:
          type: string
          description: Pagination token
    PlaceResult:
      type: object
      description: Summary of the place the reviews belong to. Returned on the first page when available.
      properties:
        ludocid:
          type: string
          description: Google CID (customer identifier) of the place, in decimal form
        place_id:
          type: string
          description: Place ID of the place, interchangeable with the place_id parameter
        data_id:
          type: string
          description: Data ID of the place, interchangeable with the data_id parameter
        title:
          type: string
          description: Name of the place
        address:
          type: string
          description: Address of the place
        rating:
          type: number
          description: Average rating of the place
        reviews:
          type: integer
          description: Total number of reviews for the place
    Topic:
      type: object
      properties:
        id:
          type: string
          description: Topic identifier. Pass it as the topic_id parameter to filter reviews by this topic.
        keyword:
          type: string
          description: Topic keyword, localized with the hl parameter
        reviews:
          type: integer
          description: Number of reviews mentioning the topic
    Review:
      type: object
      required: [review_id, user, link, source, date, iso_date]
      properties:
        review_id:
          type: string
          description: Unique identifier for the review
        user:
          $ref: '#/components/schemas/User'
        link:
          type: string
          description: Link to the review
        source:
          type: string
          description: Source of the review
        text:
          type: string
          description: Review text content. Absent when the reviewer left a rating without any text.
        translated_text:
          type: string
          description: Translated review text if available
        rating:
          type: integer
          description: Rating given by the reviewer
        rating_details:
          type: object
          description: Detailed ratings by category
        date:
          type: string
          description: Human-readable date of the review
        iso_date:
          type: string
          format: date-time
          description: ISO format date of the review
        likes:
          type: integer
          description: Number of likes (thumbs up) on the review
        images:
          type: array
          items:
            $ref: '#/components/schemas/ReviewImage'
        response:
          $ref: '#/components/schemas/ReviewResponse'
    User:
      type: object
      required: [name, thumbnail]
      properties:
        name:
          type: string
          description: Name of the reviewer
        link:
          type: string
          description: Link to the reviewer's profile
        contributor_id:
          type: string
          description: Unique identifier for the contributor
        is_local_guide:
          type: boolean
          description: Whether the user is a local guide
        reviews:
          type: integer
          description: Total number of reviews by this user
        photos:
          type: integer
          description: Total number of photos by this user
        thumbnail:
          type: string
          description: URL to user's thumbnail image
    ReviewImage:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the image
        image:
          type: string
          description: URL to the image
        description:
          type: string
          description: Description of the image
    ReviewResponse:
      type: object
      properties:
        date:
          type: string
          description: Human-readable date of the response
        iso_date:
          type: string
          format: date-time
          description: ISO format date of the response
        text:
          type: string
          description: Response text from the business
        translated_text:
          type: string
          description: Translated response text if available
    Pagination:
      type: object
      properties:
        next_page_token:
          type: string
          description: Token to retrieve the next page of results. Pass this as the next_page_token parameter in the next request.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Error message describing what went wrong